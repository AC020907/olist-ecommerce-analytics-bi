name: public-app-smoke

# Browser tests against the deployed app: after every push to main (Streamlit Cloud
# redeploys automatically), weekly, and on demand. A failure here means the public URL
# is down or showing wrong numbers.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

env:
  APP_URL: https://olist-sales-analytics.streamlit.app

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          pip install pandas==3.1.0 pyarrow==26.0.0 pytest==9.2.0 playwright==1.58.0
          playwright install --with-deps chromium
      - name: Wait for the redeploy triggered by this push
        if: github.event_name == 'push'
        run: sleep 240
      - name: End-to-end tests on the public URL
        run: pytest tests/e2e -v
