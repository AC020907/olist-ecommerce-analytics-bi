name: refresh-demo-data

# Rebuilds the warehouse from data/raw, validates it, re-exports the app's aggregates
# and opens a pull request with the result. Merging that PR redeploys the public app.
# Requires "Allow GitHub Actions to create and approve pull requests" in the repository
# settings (Settings > Actions > General).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/olist_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/olist_analytics
      OLIST_RECONCILE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/olist_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "psycopg[binary]==3.3.6" python-dotenv==1.2.4 pandas==3.1.0 pyarrow==26.0.0 pytest==9.2.0 streamlit==1.66.1 plotly==7.1.0
      - name: Ingest + transform (full rebuild)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE olist_analytics"
          python -m olist_bi build
      - name: Validate (data-quality gate)
        run: python -m olist_bi check --report reports/data_quality_report.md
      - name: Export app aggregates
        run: python -m olist_bi export
      - name: Reconcile KPIs and test
        run: pytest -v
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-demo-data
          commit-message: "chore: refresh demo data snapshot"
          title: "chore: refresh demo data snapshot"
          body: "Automated rebuild → quality gate → export → reconciliation tests all passed. Merging redeploys the public app."
          add-paths: |
            demo/data/**
            reports/data_quality_report.md
